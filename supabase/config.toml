# Supabase project config for hivai
# Run: supabase init (already done), supabase db push to apply migrations

[api]
port = 54321

[db]
port = 5432

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "5MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
