function qr(code){let h=0;for(const c of code)h=(h*31+c.charCodeAt(0))>>>0;const N=21,u=100/N;let o='';
const fin=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on;if(fin(x,y)){const lx=x%13,ly=y%13,d=Math.max(Math.abs((x<8?x:x-13)-3),Math.abs((y<8?y:y-13)-3));on=d===3||d<=1}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}
if(on)o+=`<rect x="${x*u}" y="${y*u}" width="${u}" height="${u}"/>`}return `<svg class="qr" viewBox="0 0 100 100" fill="#000" aria-label="QR code ${esc(code)}">${o}</svg>`}

function parse(t){const l=t.toLowerCase();const m=t.match(/\b(\d{1,2}\s?(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*)\b|\b((?:mon|tues?|wed(?:nes)?|thu(?:rs)?|fri|sat(?:ur)?|sun)(?:day)?)\b/i);const pr=t.match(/₹\s?\d+|\brs\.?\s?\d+/i);const v=t.match(/\bat\s+([A-Z][^.,;]*?)(?=\s+(?:on|from|with|for|by|and)\s|[.,;]|$)/);
const ty=/\b(sports?|race|match)\b/.test(l)?'Sports':/\b(mun|model un|debate)\b/.test(l)?'MUN':/\b(workshop|robotics?|coding)\b/.test(l)?'Workshop':/\bhack/.test(l)?'Hackathon':/\b(cultur\w*|dance|music|fest\w*)\b/.test(l)?'Cultural':'Other';
return {title:t.split(/\s(?:at|on|with|\.)\s|[.,\n]/)[0].slice(0,60).trim()||'Untitled event',type:ty,date:m?m[0]:'',venue:/\b(online|zoom|meet)\b/.test(l)?'Online link':v?v[1].trim():'',price:pr?pr[0].replace(/rs\.?\s?/i,'₹'):'Free',desc:t.trim(),screen:/select|screen|interview|shortlist/.test(l)||['MUN','Hackathon'].includes(ty)}}
const A={
authmode:d=>{S.au={mode:d.v,step:0};render()},
start:()=>{S.land=false;S.au={mode:'signup',step:0};render()},gologin:()=>{S.land=false;S.au={mode:'login',step:0};render()},
school:()=>{const s=val('a_school').trim();if(!s)return toast('Enter your school');S.au.school=s;S.au.ok=SCHOOLS.includes(s);S.au.step=1;render()},
backstep:()=>{S.au.step=0;render()},
signup:()=>{const u=val('a_user').trim().toLowerCase(),n=val('a_name').trim();if(!n||!u)return toast('Name and username are required');if(val('a_pass').length<6)return toast('Password needs 6+ characters');if(PEOPLE[u])return toast('Username already taken');PEOPLE[u]={name:n+' ('+val('a_type')+')',inst:S.au.school,grade:val('a_grade')||'—',unv:!S.au.ok};S.who=u;S.tab='home';boom();render()},
login:()=>{const u=val('a_user').trim().toLowerCase();if(!PEOPLE[u])return toast('No such user. Try meera or create an account');S.who=u;S.tab='home';render()},
logout:()=>{S.who=null;S.land=true;S.au={mode:'login',step:0};S.ev=null;S.iv=null;S.reg=false;S.tab='home';render()},
persona:()=>{S.who=val('persona');S.evTab='overview';S.reg=false;S.iv=null;render()},
tab:d=>{S.tab=d.v;S.fresh=null;S.iv=null;S.reg=false;render()},filter:d=>{S.filter=d.v;render()},xfilter:d=>{S.xf=d.v;render()},
open:d=>{if(S.tab!=='event')S.prev=S.tab;S.ev=d.id;S.tab='event';S.evTab='overview';S.reg=false;render()},back:()=>{S.tab=S.prev||'home';render()},opentab:d=>{if(S.tab!=='event')S.prev=S.tab;S.ev=d.id;S.tab='event';S.evTab=d.v;S.reg=false;render()},calnav:d=>{S.cal=(S.cal+ +d.v+12)%12;S.cd=null;render()},day:d=>{S.cd=S.cd===+d.d?null:+d.d;render()},evtab:d=>{S.evTab=d.v;render()},
regstart:()=>{S.reg=true;render()},cancel:()=>{S.reg=false;render()},
submit:()=>{const e=evOf(S.ev),why=val('r_why').trim(),ex=val('r_exp');if(!why)return toast('Tell us why you want to join');S.regs.push({id:'r'+(++RID),ev:e.id,user:S.who,name:me().name.split(' (')[0],school:me().inst,status:e.screen?'form':'accepted',tr:['Why join? — '+why,'Experience level — '+ex]});S.reg=false;
if(e.screen){A.interview()}else{toast('Registered! Your ticket is ready.');boom();render()}},
interview:()=>{S.iv={ev:S.ev,i:0,a:[]};render()},
next:()=>{const a=val('ans').trim();if(!a)return toast('Please type an answer');const v=S.iv,e=evOf(v.ev),qs=questions(e);v.a.push(a);
if(v.i+1<qs.length){v.i++;return render()}
const kw=e.crit.split(/[ ,]+/).filter(w=>w.length>4);let pts=0,hits=0;v.a.forEach(x=>{pts+=Math.min(22,x.split(/\s+/).length*.9);kw.forEach(k=>{if(x.toLowerCase().includes(k))hits++})});
const sc=Math.max(20,Math.min(98,Math.round(pts+hits*4)));const r=myReg(e.id);r.score=sc;r.status='review';r.tr=r.tr.concat(v.a.map((x,i)=>qs[i]+' — '+x));
r.sum=sc>=75?'Strong, specific answers that match the criteria.':sc>=55?'Reasonable answers; some depth missing.':'Short or generic answers; limited evidence.';gen('AI is scoring your interview',['Reading your answers','Matching them to the criteria','Writing your summary'],()=>{S.iv=null;toast('Interview submitted. The organizer will review.');boom();render()})},
set:d=>{S.regs.find(r=>r.id===d.id).status=d.s;toast('Marked '+STAT[d.s]);if(d.s==='accepted')boom();render()},
bulk:()=>{let n=0;S.regs.filter(r=>r.ev===S.ev&&r.score>=75&&r.status==='review').forEach(r=>{r.status='accepted';n++});toast(n+' accepted');render()},
scan:d=>{S.regs.find(r=>r.id===d.id).status='checked_in';toast('Checked in ✓');boom();render()},
post:()=>{const t=val('msg').trim();if(!t)return;S.msgs.push({ev:S.ev,aud:val('aud'),by:me().name.split(' (')[0],text:t});toast('Broadcast sent');render()},
structure:()=>{const t=val('dump').trim();if(!t)return toast('Add some details first');gen('Structuring your event with AI',['Reading your notes','Extracting date, venue and type','Drafting schedule and rules','Finding gaps to ask about'],()=>{S.draft=parse(t);render()})},
sample:()=>{const t='Science Exhibition at Gatik Lab Block on 5 Dec. Free entry. Select projects through a short interview.';gen('Structuring your event with AI',['Reading your notes','Extracting date, venue and type','Drafting schedule and rules','Finding gaps to ask about'],()=>{S.draft=parse(t);render()})},
voice:()=>{document.getElementById('dump').value='Hackathon at Gatik Innovation Hub on 12 Dec, free entry, shortlist teams via interview.';toast('Transcribed (simulated)')},
discard:()=>{S.draft=null;render()},
publish:()=>{const id='e'+(S.events.length+1);S.events.push({id,title:val('f_title')||'Untitled',type:val('f_type'),inst:me().inst,vis:val('f_vis'),mode:/online/i.test(val('f_venue'))?'Online':'Offline',venue:val('f_venue')||'TBA',date:val('f_date')||'TBA',price:val('f_price')||'Free',screen:val('f_screen')==='1',crit:val('f_crit')||'creativity, clarity, teamwork',led:val('f_led')||'student',owner:S.who,vol:(PEOPLE.kabir.inst===me().inst&&S.who!=='kabir')?['kabir']:[],desc:(S.draft&&S.draft.desc)||'Created with the AI event builder.'});
S.draft=null;S.fresh=id;gen('Generating your dashboard',['Publishing your event page','Building the registration form','Configuring AI screening','Creating tickets and check-in','Assembling your dashboard'],()=>{S.tab='mine';toast('Live! Your dashboard is ready.');boom();render()})},
vote:d=>{const i=S.ideas[d.i];i.m=!i.m;i.v+=i.m?1:-1;render()},idea:()=>{const t=val('idea').trim();if(t){S.ideas.unshift({t,v:1,s:'New'});toast('Posted anonymously');render()}},
theme:()=>{const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'},
ics:()=>{const e=evOf(S.ev),d=dateOf(e);if(!d)return toast('This event has no date yet');const t=e.date.match(/(\d{1,2}):(\d{2})\s?(AM|PM)/i),h=t?(+t[1]%12)+(/pm/i.test(t[3])?12:0):9,mi=t?+t[2]:0,p=n=>String(n).padStart(2,'0'),f=H=>'2026'+p(d.m+1)+p(d.d)+'T'+p(H)+p(mi)+'00',x=z=>String(z).replace(/[,;]/g,'\\$&');
const b=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hivai//EN','BEGIN:VEVENT','UID:'+e.id+'@hivai','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART:'+f(h),'DTEND:'+f(Math.min(h+2,23)),'SUMMARY:'+x(e.title),'LOCATION:'+x(e.venue),'END:VEVENT','END:VCALENDAR'].join('\r\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'text/calendar'}));a.download=e.title.replace(/\W+/g,'-')+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Calendar file downloaded')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.tagName!=='SELECT'&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='persona')A.persona();if(e.target.id==='f_type'){const s=document.getElementById('f_screen');if(s)s.value=['MUN','Hackathon'].includes(e.target.value)?'1':'0'}});
render();
document.getElementById('brand').innerHTML=logo(26)+' Hivai';
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const l=document.getElementById('evlist');if(l)l.innerHTML=homeList()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('.card.click,.mini'))e.target.click()});new MutationObserver(fx).observe(document.getElementById('app'),{childList:true});fx();
addEventListener('pointermove',e=>{M.x=e.clientX;M.y=e.clientY;const h=document.querySelector('.hv');if(h){h.style.setProperty('--px',(e.clientX/innerWidth-.5)*2);h.style.setProperty('--py',(e.clientY/innerHeight-.5)*2)}const g=e.target.closest&&e.target.closest('.glass');if(g){const b=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-b.left+'px');g.style.setProperty('--my',e.clientY-b.top+'px')}const t=e.target.closest&&e.target.closest('.card.click');if(t){const b=t.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;t.style.transform='perspective(700px) rotateX('+(-y*6)+'deg) rotateY('+(x*8)+'deg) translateY(-2px)'}});
addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('.card.click');if(t)t.style.transform=''});
</script></body></html>
